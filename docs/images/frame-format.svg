<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Формат кадра notify Pasito III">
  <rect width="1200" height="330" rx="18" fill="#0d1117" stroke="#1f2937"/>
  <text x="40" y="48" fill="#e6edf5" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="19" font-weight="700">Кадр notify · 6e400003…CCA9D</text>
  <text x="40" y="74" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">[seq:u8] [msg:u16 LE] [flags:u8] [declared_len:u8] [payload …]</text>

  <!-- seq -->
  <rect x="40" y="108" width="84" height="86" rx="8" fill="#0e2a28" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="82" y="143" text-anchor="middle" fill="#5eead4" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" font-weight="700">seq</text>
  <text x="82" y="163" text-anchor="middle" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11">u8</text>
  <text x="82" y="216" text-anchor="middle" fill="#5eead4" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">1 байт</text>

  <!-- msg -->
  <rect x="132" y="108" width="170" height="86" rx="8" fill="#101f30" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="217" y="143" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" font-weight="700">msg</text>
  <text x="217" y="163" text-anchor="middle" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11">u16 little-endian</text>
  <text x="217" y="216" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">2 байта</text>

  <!-- flags -->
  <rect x="310" y="108" width="90" height="86" rx="8" fill="#241d0e" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="355" y="143" text-anchor="middle" fill="#fcd34d" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" font-weight="700">flags</text>
  <text x="355" y="163" text-anchor="middle" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11">u8 = 0x00</text>
  <text x="355" y="216" text-anchor="middle" fill="#fcd34d" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">1 байт</text>

  <!-- len -->
  <rect x="408" y="108" width="118" height="86" rx="8" fill="#141a22" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="467" y="143" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700">declared_len</text>
  <text x="467" y="163" text-anchor="middle" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11">u8</text>
  <text x="467" y="216" text-anchor="middle" fill="#cbd5e1" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">1 байт</text>

  <!-- payload -->
  <rect x="534" y="108" width="626" height="86" rx="8" fill="#1b1426" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="847" y="143" text-anchor="middle" fill="#d8b4fe" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15" font-weight="700">payload</text>
  <text x="847" y="163" text-anchor="middle" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="11">ровно declared_len байт</text>
  <text x="847" y="216" text-anchor="middle" fill="#d8b4fe" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">N байт</text>

  <!-- example -->
  <text x="40" y="268" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">пример:</text>
  <text x="122" y="268" fill="#5eead4" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">0a</text>
  <text x="148" y="268" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">|</text>
  <text x="166" y="268" fill="#93c5fd" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">5c 03</text>
  <text x="212" y="268" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">|</text>
  <text x="230" y="268" fill="#fcd34d" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">00</text>
  <text x="252" y="268" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">|</text>
  <text x="270" y="268" fill="#cbd5e1" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">1d</text>
  <text x="292" y="268" fill="#8b97a8" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">|</text>
  <text x="310" y="268" fill="#d8b4fe" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13">00 3f 5c 37 04 57 5f 00 00 3f 00 00 00 ff ff 1f 00 32 2a 00 00 ff 0f 00 00</text>

  <text x="40" y="304" fill="#6b7a8f" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12">msg 0x035c = state (29 байт объявлено, доставлено 25 → truncated при ATT MTU 33) · 0x0351 = mode · 0x0370 = dvw</text>
</svg>
